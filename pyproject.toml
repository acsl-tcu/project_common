[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acsl-framework"
version = "0.6.0"
description = "Unified drone control framework - ACSL, Tokyo City University"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["acsl*"]
